name: CI

on:
  push:
    branches:
      - main
  pull_request:

permissions:
  checks: write
  pull-requests: write

jobs:
  contracts:
    name: Contracts
    uses: dharitri/drt-sc-actions/.github/workflows/contracts.yml@v6.0.0
    with:
      rust-toolchain: stable
      drt-go-scenario-version: v5.1.0
    secrets:
      token: ${{ secrets.GITHUB_TOKEN }}
